name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check
        required: false
        type: string
        default: ""
      release_tag:
        description: Release tag that must match the Cargo package version
        required: false
        type: string
        default: ""
    outputs:
      checked_sha:
        description: Commit SHA that passed the quality gate
        value: ${{ jobs.rust.outputs.checked_sha }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_TOOLCHAIN: 1.88.0

jobs:
  rust:
    name: Rust quality gate
    runs-on: ubuntu-latest
    outputs:
      checked_sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: ${{ inputs.release_tag != '' && '0' || '1' }}

      - name: Record checked commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Install Rust
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt --component clippy
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version

      - name: Cache Cargo state
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-cargo-v2-

      # Install prebuilt binaries from GitHub Releases instead of `cargo
      # install` (which compiles from source and previously took ~5-7
      # minutes combined for these two tools on every single run). This
      # also sidesteps MSRV: `cargo install` refuses to *build* newer
      # cargo-audit/cargo-llvm-cov releases against our RUST_TOOLCHAIN
      # (1.88.0), but a prebuilt binary has no such constraint. Versions
      # are still pinned for reproducibility; bump deliberately.
      - name: Install audit and coverage tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2,cargo-llvm-cov@0.8.7

      - name: Validate release version
        if: ${{ inputs.release_tag != '' }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must match vMAJOR.MINOR.PATCH, got: ${RELEASE_TAG:-<empty>}" >&2
            exit 1
          fi
          if ! tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}" 2>/dev/null)"; then
            echo "release tag does not exist: ${RELEASE_TAG}" >&2
            exit 1
          fi
          head_commit="$(git rev-parse HEAD)"
          if [[ "${tag_commit}" != "${head_commit}" ]]; then
            echo "checked out HEAD ${head_commit} does not match ${RELEASE_TAG} (${tag_commit})" >&2
            exit 1
          fi
          package_version="$(
            cargo metadata --locked --no-deps --format-version 1 |
              python3 -c 'import json, sys; packages = [p for p in json.load(sys.stdin)["packages"] if p["name"] == "rove-proxy"]; assert len(packages) == 1, f"expected one rove-proxy package, found {len(packages)}"; print(packages[0]["version"])'
          )"
          if [[ "${RELEASE_TAG}" != "v${package_version}" ]]; then
            echo "release tag ${RELEASE_TAG} does not match Cargo package version ${package_version}" >&2
            exit 1
          fi

      - name: Check public tree for secrets
        run: |
          chmod +x scripts/check-public-tree.sh
          ./scripts/check-public-tree.sh

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run dependency audit
        run: cargo audit

      # cargo llvm-cov runs unit and integration tests itself. Keep doctests as
      # a separate gate because stable cargo-llvm-cov does not run them.
      - name: Run doctests
        run: cargo test --locked --doc

      - name: Run tests and check coverage
        run: cargo llvm-cov --locked --all-targets --summary-only --fail-under-lines 80

      - name: Build release binaries
        run: cargo build --release --locked --bins

      - name: Check whitespace errors
        run: git diff --check
