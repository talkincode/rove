# rove-addrbook 构建清单（见 docs/addrbook-format.md）
#
# 用法：
#   scripts/addrbook-refresh.sh                            # 刷新全部上游（含 tarball/Azure 特殊源）
#   rove-abctl fetch --manifest addrbook/book.toml          # 仅刷新声明了 url 的直链源
#   rove-abctl build --manifest addrbook/book.toml \
#       --out addrbook/book.rab --epoch <发布序号>
#
# epoch 是单调递增的 u64 发布序号（这里用 YYYYMMDDNN），由发布方维护，
# 绝不隐式取构建机墙钟。
#
# 收录范围：这份清单只收基础设施与企业应用的地址数据——公有云官方 IP 段、CDN、
# AI / 开发者 API、交易所与金融 API、企业协作 SaaS、广告与追踪域名（用于 block）、
# 内网保留域名。判据是「一个组织会不会为成本、时延、稳定性、固定出口或合规去路由它」。
#
# 不收：以「哪些站点需要特殊访问」为组织方式的数据集。这类分类（例如按国境切分的
# geolocation 列表、带 `!cn` 后缀的取反合集、流媒体解锁与社交站点清单）服务的是
# 消费级绕行场景，不是应用出口治理，收进来只会让路由表的意图变得含糊。需要这类数据
# 的部署方可以自行在私有 manifest 里追加 [[source]]——地址簿格式本身不设限制，
# 但官方发布的 book.rab 不含它们。
epoch = 2026082401

# ══════════════ 本地维护的自定义数据 ══════════════

[[source]]
category = "corp"
kind = "cidrs"
path = "data/corp.cidrs"

[[source]]
category = "ads"
kind = "domains"
path = "data/ads.domains"

# ══════════════ 公有云官方 IP 段 ══════════════
# fetch 只下载声明 url 的源；build 离线只读本地文件。

# AWS 全量段，自动派生 aws/<service>（ec2、s3、cloudfront…）
[[source]]
category = "aws"
kind = "aws-ip-ranges"
path = "data/upstream/aws-ip-ranges.json"
url = "https://ip-ranges.amazonaws.com/ip-ranges.json"

# Azure Service Tags，自动派生 azure/<systemService>。
# 注意：download.microsoft.com 链接每周轮换，无稳定直链，
# 由 scripts/addrbook-refresh.sh 从发布页解析后下载，故不写 url。
[[source]]
category = "azure"
kind = "azure-service-tags"
path = "data/upstream/azure-service-tags.json"

# GCP 客户可用段（cloud.json），派生 gcp/<service>
[[source]]
category = "gcp"
kind = "gcp-cloud-json"
path = "data/upstream/gcp-cloud.json"
url = "https://www.gstatic.com/ipranges/cloud.json"

# Google 自有基础设施全量段（goog.json，含 8.8.8.8 等）
[[source]]
category = "google-infra"
kind = "gcp-cloud-json"
path = "data/upstream/goog.json"
url = "https://www.gstatic.com/ipranges/goog.json"

# ══════════════ 其他官方发布的 CIDR 列表 ══════════════

[[source]]
category = "cloudflare"
kind = "cidrs"
path = "data/upstream/cloudflare-v4.cidrs"
url = "https://www.cloudflare.com/ips-v4"

[[source]]
category = "cloudflare"
kind = "cidrs"
path = "data/upstream/cloudflare-v6.cidrs"
url = "https://www.cloudflare.com/ips-v6"

